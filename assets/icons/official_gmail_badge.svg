<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="64"/>
    </clipPath>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#FFFFFF"/>
  <!-- User uploaded Gmail image with black corners clipped out -->
  <image href="data:image/jpeg;base64," x="0" y="0" width="128" height="128" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>
</svg>