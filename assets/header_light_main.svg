<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <!-- Soft Charcoal Hairline Divider Gradient for Light Mode -->
    <linearGradient id="dividerGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0" />
      <stop offset="25%" stop-color="#71717A" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#18181B" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#71717A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#71717A" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Polished Black Gradient for Text Core -->
    <linearGradient id="blackCoreLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="60%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Sleek Subtle Dark Aura Glow for Light Mode -->
    <filter id="darkGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
      <feFlood flood-color="#000000" flood-opacity="0.25" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Left-to-Right Typing Clip Paths for Statements (900px width range) -->
    <!-- Statement 1 Clip: 0s to 5s -->
    <clipPath id="typeClip1">
      <rect x="150" y="205" width="0" height="60">
        <animate attributeName="width" values="0;0;900;900;900;0;0" keyTimes="0;0.02;0.12;0.27;0.31;0.34;1" dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Statement 2 Clip: 5s to 10s -->
    <clipPath id="typeClip2">
      <rect x="150" y="205" width="0" height="60">
        <animate attributeName="width" values="0;0;0;900;900;900;0;0" keyTimes="0;0.33;0.35;0.46;0.60;0.64;0.67;1" dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Statement 3 Clip: 10s to 15s -->
    <clipPath id="typeClip3">
      <rect x="150" y="205" width="0" height="60">
        <animate attributeName="width" values="0;0;0;900;900;900;0" keyTimes="0;0.66;0.68;0.79;0.93;0.97;1" dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      .name-text-light {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 92px;
        font-weight: 900;
        letter-spacing: 18px;
        fill: url(#blackCoreLight);
      }

      .identity-sub-light {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 10px;
        fill: #52525B;
      }

      .dot-accent-light {
        fill: #18181B;
      }

      /* Prominent Statement Typography (30px Bold Black) */
      .statement-text-light {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #09090B;
        text-anchor: middle;
        filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.15));
      }
    </style>
  </defs>

  <!-- 1. Dominant Focal Point: MD ZUBAIR (Enlarged 92px in Bold Black with Ambient Shadow) -->
  <g transform="translate(600, 100)">
    <text class="name-text-light" text-anchor="middle" filter="url(#darkGlowLight)">MD ZUBAIR</text>
  </g>

  <!-- 2. Strong Builder Identity Subtitle (BUILD · SYSTEMS · AUTOMATE) -->
  <g transform="translate(600, 155)">
    <text class="identity-sub-light" text-anchor="middle">
      BUILD <tspan class="dot-accent-light">·</tspan> SYSTEMS <tspan class="dot-accent-light">·</tspan> AUTOMATE
    </text>
  </g>

  <!-- 3. Minimal Soft Charcoal Divider -->
  <line x1="400" y1="185" x2="800" y2="185" stroke="url(#dividerGradLight)" stroke-width="1.5" />

  <!-- 4. Typing Reveal Statements with GPU Smooth Reveal (30px Bold Black) -->
  <!-- Statement 1 -->
  <g clip-path="url(#typeClip1)">
    <text x="600" y="248" class="statement-text-light">Performance is not a feature. It's the baseline.</text>
  </g>

  <!-- Statement 2 -->
  <g clip-path="url(#typeClip2)">
    <text x="600" y="248" class="statement-text-light">Building web systems that actually perform.</text>
  </g>

  <!-- Statement 3 -->
  <g clip-path="url(#typeClip3)">
    <text x="600" y="248" class="statement-text-light">Shipping AI pipelines that run themselves.</text>
  </g>
</svg>
