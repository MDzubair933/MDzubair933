<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <!-- Soft Golden Hairline Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6C453" stop-opacity="0" />
      <stop offset="25%" stop-color="#F6C453" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFD166" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#F6C453" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0" />
    </linearGradient>

    <!-- Balanced Warm Golden Gradient for Text Core -->
    <linearGradient id="bulbGoldCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="85%" stop-color="#F5B838" />
      <stop offset="100%" stop-color="#E59E15" />
    </linearGradient>

    <!-- Constant Clean Golden Bulb Glow (Zero Echo, High Clarity) -->
    <filter id="bulbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feFlood flood-color="#F59E0B" flood-opacity="0.75" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Matching Subtle Bulb Glow for Statements -->
    <filter id="statementBulbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.8" result="sBlur" />
      <feFlood flood-color="#F59E0B" flood-opacity="0.65" result="sGlowColor" />
      <feComposite in="sGlowColor" in2="sBlur" operator="in" result="sGlow" />
      <feMerge>
        <feMergeNode in="sGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Left-to-Right Typing Clip Paths for Statements (900px width range) -->
    <!-- Statement 1 Clip: 0s to 5s -->
    <clipPath id="typeClip1">
      <rect x="150" y="205" width="0" height="60">
        <animate attributeName="width" values="0;0;900;900;900;0;0" keyTimes="0;0.02;0.12;0.27;0.31;0.34;1" dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Statement 2 Clip: 5s to 10s -->
    <clipPath id="typeClip2">
      <rect x="150" y="205" width="0" height="60">
        <animate attributeName="width" values="0;0;0;900;900;900;0;0" keyTimes="0;0.33;0.35;0.46;0.60;0.64;0.67;1" dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Statement 3 Clip: 10s to 15s -->
    <clipPath id="typeClip3">
      <rect x="150" y="205" width="0" height="60">
        <animate attributeName="width" values="0;0;0;900;900;900;0" keyTimes="0;0.66;0.68;0.79;0.93;0.97;1" dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 92px;
        font-weight: 900;
        letter-spacing: 18px;
        fill: url(#bulbGoldCore);
      }

      .identity-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 10px;
        fill: #A8A29E;
      }

      .dot-accent {
        fill: #F6C453;
      }

      /* Prominent Statement Typography (30px) - GPU Composited */
      .statement-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: url(#bulbGoldCore);
        text-anchor: middle;
        filter: drop-shadow(0px 0px 7px rgba(245, 158, 11, 0.6));
      }
    </style>
  </defs>

  <!-- 1. Dominant Focal Point: MD ZUBAIR (Enlarged 92px) -->
  <g transform="translate(600, 100)">
    <text class="name-text" text-anchor="middle" filter="url(#bulbGlow)">MD ZUBAIR</text>
  </g>

  <!-- 2. Strong Builder Identity Subtitle (BUILD · SYSTEMS · AUTOMATE) -->
  <g transform="translate(600, 155)">
    <text class="identity-sub" text-anchor="middle">
      BUILD <tspan class="dot-accent">·</tspan> SYSTEMS <tspan class="dot-accent">·</tspan> AUTOMATE
    </text>
  </g>

  <!-- 3. Minimal Soft Gold Divider -->
  <line x1="400" y1="185" x2="800" y2="185" stroke="url(#dividerGrad)" stroke-width="1.5" />

  <!-- 4. Typing Reveal Statements with GPU Smooth Reveal (Enlarged 30px) -->
  <!-- Statement 1 -->
  <g clip-path="url(#typeClip1)">
    <text x="600" y="248" class="statement-text">Performance is not a feature. It's the baseline.</text>
  </g>

  <!-- Statement 2 -->
  <g clip-path="url(#typeClip2)">
    <text x="600" y="248" class="statement-text">Building web systems that actually perform.</text>
  </g>

  <!-- Statement 3 -->
  <g clip-path="url(#typeClip3)">
    <text x="600" y="248" class="statement-text">Shipping AI pipelines that run themselves.</text>
  </g>
</svg>
